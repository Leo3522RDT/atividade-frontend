<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favoritos — StudioCorte</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><span class="scissors">✂</span> Studio <span>Corte</span></div>
      <nav class="sidebar-nav">
        <a href="perfil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Perfil</a>
        <a href="agendamentos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Agendamentos</a>
        <a href="favoritos.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Favoritos</a>
        <a href="compras.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Compras</a>
        <a href="carteira.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Carteira</a>
        <a href="configuracoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg> Configurações</a>
      </nav>
      <div class="sidebar-footer"><div class="user-mini"><div class="avatar">LA</div><div class="info"><strong>Lucas Almeida</strong><span>Cliente Premium</span></div></div></div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div><h1>Favoritos</h1><div class="subtitle">Cortes e estilos que você salvou</div></div>
        <div class="topbar-right">
          <button onclick="SC_CLIENT.logout()" class="btn-outline" style="padding:6px 12px;font-size:12px">Sair</button>
        </div>
      </div>

      <div class="page-body">
        <div class="gallery-grid" id="favGrid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))"></div>
      </div>
    </main>
  </div>
  <script src="../js/app.js"></script>
  <script src="../js/client-common.js"></script>
  <script>
    SC_CLIENT.ensureClient();

    const FAVS = [
      { id:1, name:'Degradê Baixo', desc:'Favorito · 18/05/2024', img:'https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=300&h=300&fit=crop' },
      { id:2, name:'Pompadour Moderno', desc:'Favorito · 02/05/2024', img:'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=300&h=300&fit=crop' },
      { id:3, name:'Mid Fade Clássico', desc:'Favorito · 20/04/2024', img:'https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=300&h=300&fit=crop' },
      { id:4, name:'Texturizado Natural', desc:'Favorito · 10/04/2024', img:'https://images.unsplash.com/photo-1605497788044-5a32c7078486?w=300&h=300&fit=crop' },
      { id:5, name:'Undercut', desc:'Favorito · 05/03/2024', img:'https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=300&h=300&fit=crop' },
      { id:6, name:'Buzz Cut', desc:'Favorito · 12/02/2024', img:'https://images.unsplash.com/photo-1605497788044-5a32c7078486?w=300&h=300&fit=crop' },
      { id:7, name:'Longo Texturizado', desc:'Favorito · 28/01/2024', img:'https://images.unsplash.com/photo-1519699047748-de8e457a634e?w=300&h=300&fit=crop' },
      { id:8, name:'Fade Médio', desc:'Favorito · 15/01/2024', img:'https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=300&h=300&fit=crop' }
    ];

    function getFavs() {
      return JSON.parse(localStorage.getItem('sc_client_favs') || JSON.stringify(FAVS));
    }
    function saveFavs(l) { localStorage.setItem('sc_client_favs', JSON.stringify(l)); }

    function render() {
      const list = getFavs();
      document.getElementById('favGrid').innerHTML = list.map(f => `
        <div class="gallery-item">
          <img src="${f.img}" alt="${f.name}" onerror="this.src='https://picsum.photos/300/300?random=${f.id}'" />
          <div class="info">
            <strong>${f.name}</strong>
            <span>${f.desc}</span>
            <div style="margin-top:8px;display:flex;gap:8px">
              <button class="btn-red" style="padding:6px 10px;font-size:11px;flex:1" onclick="SC.showToast('Agendando ${f.name}...');setTimeout(()=>location.href='../agendar.html',500)">Agendar</button>
              <button style="background:#222;color:#ef4444;padding:6px 10px;border-radius:6px;font-size:11px" onclick="removeFav(${f.id})">❤️</button>
            </div>
          </div>
        </div>
      `).join('') || '<p style="color:#71717a;grid-column:1/-1;text-align:center;padding:40px">Nenhum favorito ainda</p>';
    }

    window.removeFav = (id) => {
      saveFavs(getFavs().filter(f => f.id !== id));
      SC.showToast('Removido dos favoritos');
      render();
    };

    render();
  </script>
</body>
</html>
