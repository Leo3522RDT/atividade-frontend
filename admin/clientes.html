<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes — StudioCorte Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><span class="scissors">✂</span> Studio <span>Corte</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Dashboard</a>
        <a href="clientes.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> Clientes</a>
        <a href="servicos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Serviços</a>
        <a href="produtos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> Produtos</a>
        <a href="agendamentos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Agendamentos</a>
        <a href="pedidos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Pedidos</a>
        <a href="financeiro.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Financeiro</a>
        <a href="relatorios.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg> Relatórios</a>
        <a href="marketing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Marketing</a>
        <a href="configuracoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg> Configurações</a>
      </nav>
      <div class="sidebar-footer"><div class="user-mini"><div class="avatar">AF</div><div class="info"><strong>Admin Felipe</strong><span>Administrador</span></div></div></div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div><h1>Clientes</h1><div class="subtitle">Gerencie a base de clientes do StudioCorte</div></div>
        <div class="topbar-right">
          <div class="notif-wrapper">
            <button class="notif-bell" id="notifBell" onclick="SC_ADMIN.toggleNotif()">🔔<span class="notif-badge" id="notifBadge">3</span></button>
            <div class="notif-dropdown" id="notifDropdown"></div>
          </div>
          <button class="btn-red" id="btnAddClient" style="padding:10px 16px">+ Novo Cliente</button>
          <button onclick="SC.logout()" class="btn-outline" style="padding:6px 12px;font-size:12px">Sair</button>
        </div>
      </div>

      <div class="page-body">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar clientes..." />
          </div>
        </div>

        <div class="panel">
          <table>
            <thead>
              <tr><th>Cliente</th><th>Telefone</th><th>E-mail</th><th>Agendamentos</th><th>Status</th><th>Ações</th></tr>
            </thead>
            <tbody id="clientsTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="clientModal">
    <div class="modal">
      <h3 id="modalTitle">Novo Cliente</h3>
      <form id="clientForm">
        <input type="hidden" id="clientId" />
        <div class="form-group"><label>Nome</label><input type="text" id="cliName" required /></div>
        <div class="form-group"><label>Telefone</label><input type="text" id="cliPhone" required placeholder="(11) 99999-0000" /></div>
        <div class="form-group"><label>E-mail</label><input type="email" id="cliEmail" required /></div>
        <div class="actions">
          <button type="button" class="btn-secondary" onclick="document.getElementById('clientModal').classList.remove('show')">Cancelar</button>
          <button type="submit" class="btn-primary" style="width:auto;padding:10px 20px">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin-common.js"></script>
  <script>
    if (!SC.isLoggedIn() || SC.getUser().role !== 'admin') location.href = '../login.html';
    SC_ADMIN.renderNotifications();

    const DEFAULT_CLIENTS = [
      { id: 1, name: 'João Silva', phone: '(11) 98765-4321', email: 'joao@email.com', appointments: 8, status: 'Ativo' },
      { id: 2, name: 'Lucas Mendes', phone: '(11) 91234-5678', email: 'lucas.m@email.com', appointments: 5, status: 'Ativo' },
      { id: 3, name: 'Mateus Rocha', phone: '(11) 99876-5432', email: 'mateus@email.com', appointments: 12, status: 'Premium' },
      { id: 4, name: 'Rafael Lima', phone: '(11) 93456-7890', email: 'rafael@email.com', appointments: 3, status: 'Ativo' },
      { id: 5, name: 'Bruno Ferreira', phone: '(11) 94567-8901', email: 'bruno@email.com', appointments: 7, status: 'Ativo' },
      { id: 6, name: 'Pedro Costa', phone: '(11) 97654-3210', email: 'pedro@email.com', appointments: 2, status: 'Inativo' }
    ];

    function getClients() {
      return JSON.parse(localStorage.getItem('sc_clients') || JSON.stringify(DEFAULT_CLIENTS));
    }
    function saveClients(list) { localStorage.setItem('sc_clients', JSON.stringify(list)); }

    function render() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const list = getClients().filter(c => c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q) || c.phone.includes(q));
      document.getElementById('clientsTable').innerHTML = list.map(c => `
        <tr>
          <td><div class="client-cell"><div class="avatar-sm">${c.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div><strong>${c.name}</strong></div></td>
          <td>${c.phone}</td>
          <td>${c.email}</td>
          <td>${c.appointments}</td>
          <td><span class="badge ${c.status==='Premium'?'confirmed':c.status==='Inativo'?'canceled':'pending'}">${c.status}</span></td>
          <td><div class="actions">
            <button title="Ver perfil do cliente" onclick="verPerfil('${c.name}')">👤</button>
            <button onclick="editClient(${c.id})">✏️</button>
            <button class="delete" onclick="delClient(${c.id})">🗑️</button>
          </div></td>
        </tr>
      `).join('') || '<tr><td colspan="6" style="text-align:center;padding:40px;color:#71717a">Nenhum cliente encontrado</td></tr>';
    }

    let editingId = null;
    document.getElementById('btnAddClient').onclick = () => {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'Novo Cliente';
      document.getElementById('clientForm').reset();
      document.getElementById('clientModal').classList.add('show');
    };

    window.editClient = (id) => {
      const c = getClients().find(x => x.id === id);
      if (!c) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'Editar Cliente';
      document.getElementById('cliName').value = c.name;
      document.getElementById('cliPhone').value = c.phone;
      document.getElementById('cliEmail').value = c.email;
      document.getElementById('clientModal').classList.add('show');
    };

    window.delClient = (id) => {
      if (!confirm('Excluir este cliente?')) return;
      saveClients(getClients().filter(c => c.id !== id));
      SC.showToast('Cliente removido');
      render();
    };

    document.getElementById('clientForm').onsubmit = (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('cliName').value.trim(),
        phone: document.getElementById('cliPhone').value.trim(),
        email: document.getElementById('cliEmail').value.trim(),
        appointments: 0,
        status: 'Ativo'
      };
      let list = getClients();
      if (editingId) {
        list = list.map(c => c.id === editingId ? { ...c, ...data } : c);
        SC.showToast('Cliente atualizado');
      } else {
        data.id = Date.now();
        list.push(data);
        SC.showToast('Cliente adicionado');
      }
      saveClients(list);
      document.getElementById('clientModal').classList.remove('show');
      render();
    };

    document.getElementById('searchInput').oninput = render;
    window.verPerfil = function(name) {
      // Login as client demo and go to profile
      localStorage.setItem('sc_user', JSON.stringify({ email: 'lucas.almeida@email.com', name: name || 'Lucas Almeida', role: 'client' }));
      SC.showToast('Abrindo perfil de ' + (name || 'cliente') + '...');
      setTimeout(() => location.href = '../cliente/perfil.html', 400);
    };
    render();
  </script>
</body>
</html>
