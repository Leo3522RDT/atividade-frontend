            <span>Administrador</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1>Produtos</h1>
          <div class="subtitle">Gerencie os produtos da sua barbearia.</div>
        </div>
        <div class="topbar-right">
          <div class="notif-wrapper">
            <button class="notif-bell" id="notifBell" onclick="SC_ADMIN.toggleNotif()">🔔<span class="notif-badge" id="notifBadge">3</span></button>
            <div class="notif-dropdown" id="notifDropdown"></div>
          </div>
          <button class="btn-red" id="btnAdd" style="padding:10px 18px">+ Adicionar produto</button>
        </div>
      </div>

      <div class="page-body">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar produtos..." />
          </div>
          <div class="filters">
            <select id="filterCategory">
              <option value="">Todas as categorias</option>
              <option>Pomadas</option>
              <option>Shampoo</option>
              <option>Óleos e Cremes</option>
              <option>Acessórios</option>
            </select>
            <select id="filterStatus">
              <option value="">Todos os status</option>
              <option value="ok">Em estoque</option>
              <option value="low">Estoque baixo</option>
            </select>
          </div>
        </div>

        <div class="panel">
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="productsTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Add/Edit -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <h3 id="modalTitle">Adicionar produto</h3>
      <form id="productForm">
        <input type="hidden" id="productId" />
        <div class="form-group">
          <label>Nome</label>
          <input type="text" id="prodName" required placeholder="Ex: Pomada Modeladora" />
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select id="prodCategory" required>
            <option>Pomadas</option>
            <option>Shampoo</option>
            <option>Óleos e Cremes</option>
            <option>Acessórios</option>
          </select>
        </div>
        <div class="form-group">
          <label>Preço (R$)</label>
          <input type="number" id="prodPrice" step="0.01" min="0" required placeholder="45.00" />
        </div>
        <div class="form-group">
          <label>Estoque</label>
          <input type="number" id="prodStock" min="0" required placeholder="24" />
        </div>
        <div class="form-group">
          <label>Imagem do produto</label>
          <input type="url" id="prodImgUrl" placeholder="https://exemplo.com/imagem.jpg" />
          <input type="file" id="prodImgFile" accept="image/*" style="margin-top:8px" />
          <img id="imgPreview" class="img-preview" alt="Preview" />
        </div>
        <div class="actions">
          <button type="button" class="btn-secondary" id="btnCancel">Cancelar</button>
          <button type="submit" class="btn-primary" style="width:auto;padding:10px 20px">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin-common.js"></script>
  <script>
    if (!SC.isLoggedIn() || SC.getUser().role !== 'admin') {
      location.href = '../login.html';
    }
    SC_ADMIN.renderNotifications();

    let editingId = null;

    // Image preview
    document.getElementById('prodImgFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const preview = document.getElementById('imgPreview');
        preview.src = ev.target.result;
        preview.classList.add('show');
        document.getElementById('prodImgUrl').value = ev.target.result; // data URL for demo
      };
      reader.readAsDataURL(file);
    });
    document.getElementById('prodImgUrl').addEventListener('input', function() {
      const preview = document.getElementById('imgPreview');
      if (this.value) {
        preview.src = this.value;
        preview.classList.add('show');
      } else {
        preview.classList.remove('show');
      }
    });

    function renderProducts() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('filterCategory').value;
      const status = document.getElementById('filterStatus').value;

      let list = SC.getProducts().filter(p => {
        const matchSearch = p.name.toLowerCase().includes(search);
        const matchCat = !cat || p.category === cat;
        const matchStatus = !status || p.status === status;
        return matchSearch && matchCat && matchStatus;
      });

      const tbody = document.getElementById('productsTable');
      tbody.innerHTML = list.map(p => `
        <tr class="product-row">
          <td>
            <div style="display:flex;align-items:center;gap:12px">
              <img src="${p.img || 'https://via.placeholder.com/44'}" alt="" onerror="this.src='https://via.placeholder.com/44/222/666?text=P'" />
              <div>
                <strong>${p.name}</strong><br>
                <span style="font-size:12px;color:#71717a">${p.category}</span>
              </div>
            </div>
          </td>
          <td>${SC.formatMoney(p.price)}</td>
          <td>
            <span class="${p.status === 'low' ? 'stock-low' : 'stock-ok'}">
              ● ${p.stock} ${p.status === 'low' ? 'estoque baixo' : 'em estoque'}
            </span>
          </td>
          <td>
            <div class="actions">
              <button onclick="openEdit(${p.id})" title="Editar">✏️</button>
              <button class="delete" onclick="confirmDelete(${p.id})" title="Excluir">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="4" style="text-align:center;padding:40px;color:#71717a">Nenhum produto encontrado</td></tr>';
    }

    function openModal(title) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('productModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('productModal').classList.remove('show');
      document.getElementById('productForm').reset();
      editingId = null;
    }

    document.getElementById('btnAdd').addEventListener('click', () => {
      editingId = null;
      openModal('Adicionar produto');
    });

    document.getElementById('btnCancel').addEventListener('click', closeModal);

    window.openEdit = function(id) {
      const p = SC.getProducts().find(x => x.id === id);
      if (!p) return;
      editingId = id;
      document.getElementById('prodName').value = p.name;
      document.getElementById('prodCategory').value = p.category;
      document.getElementById('prodPrice').value = p.price;
      document.getElementById('prodStock').value = p.stock;
      openModal('Editar produto');
    };

    window.confirmDelete = function(id) {
      if (confirm('Tem certeza que deseja excluir este produto?')) {
        SC.deleteProduct(id);
        SC.showToast('Produto excluído');
        renderProducts();
      }
    };

    document.getElementById('productForm').addEventListener('submit', function(e) {
      e.preventDefault();
      let img = document.getElementById('prodImgUrl').value.trim();
      if (!img) img = 'https://images.unsplash.com/photo-1620916565914-4a87f2b2f3b8?w=100&h=100&fit=crop';
      const data = {
        name: document.getElementById('prodName').value.trim(),
        category: document.getElementById('prodCategory').value,
        price: parseFloat(document.getElementById('prodPrice').value),
        stock: parseInt(document.getElementById('prodStock').value),
        img: img
      };

      if (editingId) {
        SC.updateProduct(editingId, data);
        SC.showToast('Produto atualizado');
      } else {
        SC.addProduct(data);
        SC.showToast('Produto adicionado');
      }
      closeModal();
      renderProducts();
    });

    document.getElementById('searchInput').addEventListener('input', renderProducts);
    document.getElementById('filterCategory').addEventListener('change', renderProducts);
    document.getElementById('filterStatus').addEventListener('change', renderProducts);

    renderProducts();
  </script>
</body>
