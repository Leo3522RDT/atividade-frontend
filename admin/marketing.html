<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marketing — StudioCorte Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><span class="scissors">✂</span> Studio <span>Corte</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Dashboard</a>
        <a href="clientes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> Clientes</a>
        <a href="servicos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Serviços</a>
        <a href="produtos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> Produtos</a>
        <a href="agendamentos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Agendamentos</a>
        <a href="pedidos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Pedidos</a>
        <a href="financeiro.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Financeiro</a>
        <a href="relatorios.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg> Relatórios</a>
        <a href="marketing.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Marketing</a>
        <a href="configuracoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg> Configurações</a>
      </nav>
      <div class="sidebar-footer"><div class="user-mini"><div class="avatar">AF</div><div class="info"><strong>Admin Felipe</strong><span>Administrador</span></div></div></div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div><h1>Marketing</h1><div class="subtitle">Campanhas, cupons e comunicação</div></div>
        <div class="topbar-right">
          <div class="notif-wrapper">
            <button class="notif-bell" id="notifBell" onclick="SC_ADMIN.toggleNotif()">🔔<span class="notif-badge" id="notifBadge">3</span></button>
            <div class="notif-dropdown" id="notifDropdown"></div>
          </div>
          <button class="btn-red" id="btnNewCamp" style="padding:10px 16px">+ Nova Campanha</button>
          <button onclick="SC.logout()" class="btn-outline" style="padding:6px 12px;font-size:12px">Sair</button>
        </div>
      </div>

      <div class="page-body">
        <div class="settings-grid">
          <div class="settings-card">
            <h3>📢 Campanhas</h3>
            <div id="campaignsList"></div>
            <button class="btn-red" style="padding:10px 16px;width:auto;margin-top:12px" id="btnNewCamp2">+ Nova Campanha</button>
          </div>

          <div class="settings-card">
            <h3>✉️ Mensagens Automáticas</h3>
            <p style="font-size:13px;color:#a1a1aa;margin-bottom:12px">Templates de WhatsApp e e-mail.</p>
            <button class="btn-outline" style="padding:10px 16px;margin-bottom:8px;display:block;width:100%" onclick="openTemplate('Confirmação de horário')">Template: Confirmação de horário</button>
            <button class="btn-outline" style="padding:10px 16px;margin-bottom:8px;display:block;width:100%" onclick="openTemplate('Lembrete 24h antes')">Template: Lembrete 24h antes</button>
            <button class="btn-outline" style="padding:10px 16px;display:block;width:100%" onclick="openTemplate('Avaliação pós-corte')">Template: Avaliação pós-corte</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="campModal">
    <div class="modal">
      <h3>Nova Campanha</h3>
      <form id="campForm">
        <div class="form-group"><label>Nome da campanha</label><input type="text" id="campName" required placeholder="Ex: Desconto 20% Black Friday" /></div>
        <div class="form-group"><label>Descrição</label><input type="text" id="campDesc" placeholder="Detalhes da promoção" /></div>
        <div class="form-group"><label>Validade</label><input type="date" id="campValid" /></div>
        <div class="actions">
          <button type="button" class="btn-secondary" onclick="document.getElementById('campModal').classList.remove('show')">Cancelar</button>
          <button type="submit" class="btn-primary" style="width:auto;padding:10px 20px">Criar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="tplModal">
    <div class="modal">
      <h3 id="tplTitle">Template</h3>
      <textarea id="tplContent" rows="6" style="width:100%;margin:12px 0;padding:12px;background:#0f0f0f;border:1px solid #333;border-radius:8px;color:white;resize:vertical"></textarea>
      <div class="actions">
        <button type="button" class="btn-secondary" onclick="document.getElementById('tplModal').classList.remove('show')">Fechar</button>
        <button type="button" class="btn-primary" style="width:auto;padding:10px 20px" onclick="SC.showToast('Template salvo!');document.getElementById('tplModal').classList.remove('show')">Salvar Template</button>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin-common.js"></script>
  <script>
    if (!SC.isLoggedIn() || SC.getUser().role !== 'admin') location.href = '../login.html';
    SC_ADMIN.renderNotifications();

    const DEFAULT = [
      { id:1, name:'Desconto 15% — Primeira visita', desc:'Válido até 31/05/2025 · 48 usos', active:true },
      { id:2, name:'Indique um amigo — R$ 20 de crédito', desc:'Ativo · 12 indicações este mês', active:true }
    ];

    function getCamps() { return JSON.parse(localStorage.getItem('sc_campaigns') || JSON.stringify(DEFAULT)); }
    function saveCamps(l) { localStorage.setItem('sc_campaigns', JSON.stringify(l)); }

    function renderCamps() {
      document.getElementById('campaignsList').innerHTML = getCamps().map(c => `
        <div style="margin-bottom:12px;padding:12px;background:#0f0f0f;border-radius:8px;border:1px solid #222;display:flex;justify-content:space-between;align-items:center">
          <div>
            <strong style="font-size:14px">${c.name}</strong>
            <p style="font-size:12px;color:#a1a1aa;margin-top:4px">${c.desc || ''}</p>
          </div>
          <button style="background:none;color:#ef4444" onclick="delCamp(${c.id})">🗑️</button>
        </div>
      `).join('') || '<p style="color:#71717a;font-size:13px">Nenhuma campanha ativa</p>';
    }

    window.delCamp = (id) => {
      if (!confirm('Excluir campanha?')) return;
      saveCamps(getCamps().filter(c => c.id !== id));
      SC.showToast('Campanha removida');
      renderCamps();
    };

    function openCampModal() {
      document.getElementById('campForm').reset();
      document.getElementById('campModal').classList.add('show');
    }
    document.getElementById('btnNewCamp').onclick = openCampModal;
    document.getElementById('btnNewCamp2').onclick = openCampModal;

    document.getElementById('campForm').onsubmit = (e) => {
      e.preventDefault();
      const list = getCamps();
      list.unshift({
        id: Date.now(),
        name: document.getElementById('campName').value.trim(),
        desc: document.getElementById('campDesc').value.trim() || 'Nova campanha',
        active: true
      });
      saveCamps(list);
      document.getElementById('campModal').classList.remove('show');
      SC.showToast('Campanha criada!');
      renderCamps();
    };

    const TEMPLATES = {
      'Confirmação de horário': 'Olá {nome}! Seu horário no StudioCorte está confirmado para {data} às {hora}. Te esperamos!',
      'Lembrete 24h antes': 'Oi {nome}! Lembrete: amanhã às {hora} você tem horário no StudioCorte. Até logo!',
      'Avaliação pós-corte': 'Oi {nome}! Como ficou o corte? Avalie nosso atendimento: {link}'
    };

    window.openTemplate = (name) => {
      document.getElementById('tplTitle').textContent = name;
      document.getElementById('tplContent').value = TEMPLATES[name] || '';
      document.getElementById('tplModal').classList.add('show');
    };

    renderCamps();
  </script>
</body>
</html>
