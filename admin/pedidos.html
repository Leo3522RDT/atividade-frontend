<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos — StudioCorte Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-logo"><span class="scissors">✂</span> Studio <span>Corte</span></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Dashboard</a>
        <a href="clientes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg> Clientes</a>
        <a href="servicos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Serviços</a>
        <a href="produtos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> Produtos</a>
        <a href="agendamentos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Agendamentos</a>
        <a href="pedidos.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Pedidos</a>
        <a href="financeiro.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Financeiro</a>
        <a href="relatorios.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10M12 20V4M6 20v-6"/></svg> Relatórios</a>
        <a href="marketing.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Marketing</a>
        <a href="configuracoes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg> Configurações</a>
      </nav>
      <div class="sidebar-footer"><div class="user-mini"><div class="avatar">AF</div><div class="info"><strong>Admin Felipe</strong><span>Administrador</span></div></div></div>
    </aside>

    <main class="main-content">
      <div class="topbar">
        <div><h1>Pedidos</h1><div class="subtitle">Pedidos de produtos da loja</div></div>
        <div class="topbar-right">
          <div class="notif-wrapper">
            <button class="notif-bell" id="notifBell" onclick="SC_ADMIN.toggleNotif()">🔔<span class="notif-badge" id="notifBadge">3</span></button>
            <div class="notif-dropdown" id="notifDropdown"></div>
          </div>
          <button class="btn-red" id="btnNewOrder" style="padding:10px 16px">+ Novo Pedido</button>
          <button onclick="SC.logout()" class="btn-outline" style="padding:6px 12px;font-size:12px">Sair</button>
        </div>
      </div>

      <div class="page-body">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="Buscar pedidos..." />
          </div>
          <div class="filters">
            <select id="filterStatus">
              <option value="">Todos os status</option>
              <option>Em preparação</option>
              <option>Enviado</option>
              <option>Entregue</option>
              <option>Cancelado</option>
            </select>
          </div>
        </div>

        <div class="panel">
          <table>
            <thead>
              <tr><th>Pedido</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Status</th><th>Data</th><th>Ações</th></tr>
            </thead>
            <tbody id="ordersTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="orderModal">
    <div class="modal">
      <h3>Novo Pedido</h3>
      <form id="orderForm">
        <div class="form-group"><label>Cliente</label><input type="text" id="ordClient" required placeholder="Nome do cliente" /></div>
        <div class="form-group"><label>Itens</label><input type="text" id="ordItems" required placeholder="Ex: Pomada + Shampoo" /></div>
        <div class="form-group"><label>Total (R$)</label><input type="number" id="ordTotal" step="0.01" required /></div>
        <div class="actions">
          <button type="button" class="btn-secondary" onclick="document.getElementById('orderModal').classList.remove('show')">Cancelar</button>
          <button type="submit" class="btn-primary" style="width:auto;padding:10px 20px">Criar Pedido</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/admin-common.js"></script>
  <script>
    if (!SC.isLoggedIn() || SC.getUser().role !== 'admin') location.href = '../login.html';
    SC_ADMIN.renderNotifications();

    const DEFAULT = [
      { id: 1042, client: 'Lucas Almeida', items: 'Pomada + Shampoo + Óleo', total: 144.70, status: 'Em preparação', date: '15/05/2025' },
      { id: 1041, client: 'João Silva', items: 'Kit Pente + Escova', total: 55.00, status: 'Entregue', date: '14/05/2025' },
      { id: 1040, client: 'Mateus Rocha', items: 'Shampoo Anticaspa', total: 35.00, status: 'Entregue', date: '13/05/2025' },
      { id: 1039, client: 'Rafael Lima', items: 'Óleo para Barba', total: 35.00, status: 'Cancelado', date: '12/05/2025' }
    ];

    function getOrders() { return JSON.parse(localStorage.getItem('sc_orders') || JSON.stringify(DEFAULT)); }
    function saveOrders(l) { localStorage.setItem('sc_orders', JSON.stringify(l)); }

    function statusClass(s) {
      if (s === 'Entregue') return 'confirmed';
      if (s === 'Em preparação' || s === 'Enviado') return 'waiting';
      return 'canceled';
    }

    function render() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const st = document.getElementById('filterStatus').value;
      let list = getOrders().filter(o => {
        const match = o.client.toLowerCase().includes(q) || String(o.id).includes(q) || o.items.toLowerCase().includes(q);
        return match && (!st || o.status === st);
      });
      document.getElementById('ordersTable').innerHTML = list.map(o => `
        <tr>
          <td><strong>#${o.id}</strong></td>
          <td>${o.client}</td>
          <td>${o.items}</td>
          <td>${SC.formatMoney(o.total)}</td>
          <td><span class="badge ${statusClass(o.status)}">${o.status}</span></td>
          <td>${o.date}</td>
          <td>
            <div class="actions">
              <button title="Marcar Enviado" onclick="setStatus(${o.id},'Enviado')">📦</button>
              <button title="Marcar Entregue" onclick="setStatus(${o.id},'Entregue')">✅</button>
              <button title="Cancelar" onclick="setStatus(${o.id},'Cancelado')">❌</button>
              <button class="delete" onclick="delOrder(${o.id})">🗑️</button>
            </div>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="7" style="text-align:center;padding:40px;color:#71717a">Nenhum pedido encontrado</td></tr>';
    }

    window.setStatus = (id, status) => {
      const list = getOrders().map(o => o.id === id ? { ...o, status } : o);
      saveOrders(list);
      SC.showToast('Status atualizado: ' + status);
      render();
    };
    window.delOrder = (id) => {
      if (!confirm('Excluir pedido?')) return;
      saveOrders(getOrders().filter(o => o.id !== id));
      SC.showToast('Pedido removido');
      render();
    };

    document.getElementById('btnNewOrder').onclick = () => {
      document.getElementById('orderForm').reset();
      document.getElementById('orderModal').classList.add('show');
    };

    document.getElementById('orderForm').onsubmit = (e) => {
      e.preventDefault();
      const list = getOrders();
      const newId = list.length ? Math.max(...list.map(o => o.id)) + 1 : 1001;
      list.unshift({
        id: newId,
        client: document.getElementById('ordClient').value.trim(),
        items: document.getElementById('ordItems').value.trim(),
        total: parseFloat(document.getElementById('ordTotal').value),
        status: 'Em preparação',
        date: new Date().toLocaleDateString('pt-BR')
      });
      saveOrders(list);
      document.getElementById('orderModal').classList.remove('show');
      SC.showToast('Pedido #' + newId + ' criado!');
      render();
    };

    document.getElementById('searchInput').oninput = render;
    document.getElementById('filterStatus').onchange = render;
    render();
  </script>
</body>
</html>
